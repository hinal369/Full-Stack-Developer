<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>
    <style>
        /* Basic styling to make the form clean and centered */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        form {
            background: #ffffff;
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 1rem;
        }
        textarea {
            resize: vertical; /* Allows users to resize vertically only */
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <form action="#" method="POST" >
        
        <h2>Contact Us</h2>

        <div class="form-group">
            <label for="user-name">Full Name:</label>
            <input type="text" id="user-name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="user-email">Email Address:</label>
            <input type="email" id="user-email" name="email" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
            <label for="inquiry-reason">Reason for Contact:</label>
            <select id="inquiry-reason" name="reason">
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="billing">Billing/Sales</option>
            </select>
        </div>

        <div class="form-group">
            <label for="user-message">Message:</label>
            <textarea id="user-message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit" >Send Message</button>

    </form>

</body>
</html>
