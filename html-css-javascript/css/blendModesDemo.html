<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Blend Modes Laboratory</title>
  <style>
    body {
      background-color: #111;
      font-family: sans-serif;
      padding: 2rem;
      margin: 0;
    }

    h2 {
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      width: 100%;
      border-bottom: 2px solid #333;
      padding-bottom: 0.5rem;
      margin-top: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #333;
    }

    /* The blending container mixes the amber background color 
      with the flower image nested inside it.
    */
    .blend-container {
      width: 100%;
      height: 150px;
      background-color: #ffcc00; /* Bright amber/yellow */
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden; /* Keeps the image corners rounded */
    }

    .blend-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Keeps the photo well-proportioned */
      display: block;
    }

    .label {
      font-family: monospace;
      font-weight: bold;
      color: #aaa;
      font-size: 1.1rem;
    }

    /* --- SEPARABLE VALUES --- */
    .normal { mix-blend-mode: normal; }
    .multiply { mix-blend-mode: multiply; }
    .screen { mix-blend-mode: screen; }
    .overlay { mix-blend-mode: overlay; }
    .darken { mix-blend-mode: darken; }
    .lighten { mix-blend-mode: lighten; }
    .color-dodge { mix-blend-mode: color-dodge; }
    .color-burn { mix-blend-mode: color-burn; }
    .hard-light { mix-blend-mode: hard-light; }
    .soft-light { mix-blend-mode: soft-light; }
    .difference { mix-blend-mode: difference; }
    .exclusion { mix-blend-mode: exclusion; }

    /* --- NON-SEPARABLE VALUES --- */
    .hue { mix-blend-mode: hue; }
    .saturation { mix-blend-mode: saturation; }
    .color { mix-blend-mode: color; }
    .luminosity { mix-blend-mode: luminosity; }
  </style>
</head>
<body>

  <h2>Separable Blend Modes (Channel-by-Channel Math)</h2>
  <div class="grid">
    <div class="card"><div class="blend-container"><img class="normal" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">normal</div></div>
    <div class="card"><div class="blend-container"><img class="multiply" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">multiply</div></div>
    <div class="card"><div class="blend-container"><img class="screen" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">screen</div></div>
    <div class="card"><div class="blend-container"><img class="overlay" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">overlay</div></div>
    <div class="card"><div class="blend-container"><img class="darken" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">darken</div></div>
    <div class="card"><div class="blend-container"><img class="lighten" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">lighten</div></div>
    <div class="card"><div class="blend-container"><img class="color-dodge" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">color-dodge</div></div>
    <div class="card"><div class="blend-container"><img class="color-burn" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">color-burn</div></div>
    <div class="card"><div class="blend-container"><img class="hard-light" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">hard-light</div></div>
    <div class="card"><div class="blend-container"><img class="soft-light" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">soft-light</div></div>
    <div class="card"><div class="blend-container"><img class="difference" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">difference</div></div>
    <div class="card"><div class="blend-container"><img class="exclusion" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">exclusion</div></div>
  </div>

  <h2>Non-Separable Blend Modes (HSL Component Swapping)</h2>
  <div class="grid">
    <div class="card"><div class="blend-container"><img class="hue" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">hue</div></div>
    <div class="card"><div class="blend-container"><img class="saturation" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">saturation</div></div>
    <div class="card"><div class="blend-container"><img class="color" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">color</div></div>
    <div class="card"><div class="blend-container"><img class="luminosity" src="https://images.unsplash.com/photo-1517646450441-a0faf4152caf" alt="Red flowers"></div><div class="label">luminosity</div></div>
  </div>

</body>
</html>
