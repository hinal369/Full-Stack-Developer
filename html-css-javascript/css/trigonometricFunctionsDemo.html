<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trigonometric Functions Demo</title>
    <style>
      :root {
        --orbit-radius: 30dvh;
        --dot-radius: 2dvh;
      }

      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      @keyframes orbit {
        from {
          --angle: 0deg;
        }
        to {
          --angle: 360deg;
        }
      }

      #sin-oscillator {
        animation: orbit 5s linear infinite;
        top: calc(50dvh + var(--orbit-radius) * sin(var(--angle)));
        background: red;
      } 

      #cos-oscillator {
        animation: orbit 5s linear infinite;
        left: calc(50dvw + var(--orbit-radius) * cos(var(--angle)));
        background: green;
      }

      #orbiter {
        animation: orbit 5s linear infinite;
        left: calc(50dvw + var(--orbit-radius) * cos(var(--angle)));
        top: calc(50dvh + var(--orbit-radius) * sin(var(--angle)));
        background: blue;
      }

      /* decorative styles */

      #orbit {
        position: absolute;
        left: calc(50dvw - var(--orbit-radius) + var(--dot-radius));
        top: calc(50dvh - var(--orbit-radius) + var(--dot-radius));
        border: solid 1px blue;
        width: calc(2 * var(--orbit-radius));
        height: calc(2 * var(--orbit-radius));
        border-radius: 50%;
      }

      #x-axis {
        position: absolute;
        left: calc(50dvw + var(--dot-radius));
        top: calc(50dvh - var(--orbit-radius) + var(--dot-radius));
        width: 0;
        height: 60dvh;
        border-left: solid 1px red;
      }

      #y-axis {
        position: absolute;
        left: calc(50dvw - var(--orbit-radius) + var(--dot-radius));
        top: calc(50dvh + var(--dot-radius));
        width: 60dvh;
        height: 0;
        border-top: solid 1px green;
      }

      #a-projection {
        animation: orbit 5s linear infinite;
        position: absolute;
        left: calc(50dvw + var(--dot-radius));
        top: calc(50dvh + var(--dot-radius));
        width: calc(var(--orbit-radius) + var(--dot-radius));
        height: 0;
        transform-origin: left;
        transform: rotate(var(--angle));
        border-top: dashed 1px blue;
      }

      .circle {
        position: absolute;
        left: 50dvw;
        top: 50dvh;
        width: calc(2 * var(--dot-radius));
        height: calc(2 * var(--dot-radius));
        clip-path: circle(var(--dot-radius));
      }
    </style>
  </head>
  <body>
    <div id="example">
      <div id="orbit"></div>
      <div id="x-axis"></div>
      <div id="y-axis"></div>
      <div id="a-projection"></div>
      <div id="sin-oscillator" class="circle"></div>
      <div id="cos-oscillator" class="circle"></div>
      <div id="orbiter" class="circle"></div>
    </div>
  </body>
</html>
